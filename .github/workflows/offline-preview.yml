name: Verify bundled offline preview
on:
  push:
    branches: [offline-apk-fix]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: offline-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Audit the previously linked 0.3 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/evidence
          gh api repos/Bhargav2301/polymath_ai_news_chat/actions/artifacts/10095846353/zip > previous.zip
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          path = pathlib.Path('previous.zip')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '65e568c8364bb8219e9f620fdddb1be0b4ad71bd0e6c1fcee7b81ce609fb17e6'
          with zipfile.ZipFile(path) as archive:
              matches = [n for n in archive.namelist() if n.endswith('app/build/outputs/apk/debug/app-debug.apk')]
              assert len(matches) == 1
              pathlib.Path('previous.apk').write_bytes(archive.read(matches[0]))
          PY
          python3 scripts/inspect_apk.py previous.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" > release-assets/evidence/previous-apk-audit.json
          cat release-assets/evidence/previous-apk-audit.json
      - name: Prepare the pinned runtime and included model
        run: python3 scripts/prepare_local_llm.py --bundle-assets .native/offline-assets
      - name: Build and test the distributable APK
        working-directory: android
        run: |
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:model:test :core:data:testDebugUnitTest :core:local:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug -PpolymathOfflinePreview=true -PpolymathModelAssets="$GITHUB_WORKSPACE/.native/offline-assets" --max-workers=2
      - name: Verify APK identity, bundled weights, signature and native alignment
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Polymath_0.3.1_offline_preview.apk
          python3 scripts/inspect_apk.py release-assets/Polymath_0.3.1_offline_preview.apk --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --require-bundled > release-assets/BUILD_INFO.json
          python3 scripts/verify_native_apk.py release-assets/Polymath_0.3.1_offline_preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-assets/Polymath_0.3.1_offline_preview.apk > release-assets/evidence/signature.txt
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          path = pathlib.Path('release-assets/BUILD_INFO.json')
          info = json.loads(path.read_text())
          info.update(source_commit=os.environ['GITHUB_SHA'], build_run=int(os.environ['GITHUB_RUN_ID']), bundled_model=True)
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in pathlib.Path('android').glob('**/build/test-results/**/TEST-*.xml'):
              suite = ET.parse(report).getroot()
              for name in totals: totals[name] += int(suite.attrib.get(name, 0))
          assert totals['tests'] >= 53 and totals['failures'] == totals['errors'] == totals['skipped'] == 0, totals
          info['android_unit_tests'] = totals
          path.write_text(json.dumps(info, indent=2) + '\n')
          pathlib.Path('release-assets/SHA256SUMS').write_text(info['apk_sha256'] + '  Polymath_0.3.1_offline_preview.apk\n')
          print(path.read_text())
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ram-size: 6144M
          heap-size: 512M
          disable-animations: true
          script: |
            adb install release-assets/Polymath_0.3.1_offline_preview.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w -r -e class com.polymath.app.OfflineSetupInstrumentedTest com.polymath.app.offline.test/androidx.test.runner.AndroidJUnitRunner | tee release-assets/evidence/offline-ui-tests.txt
            adb logcat -d -s AndroidRuntime libc > release-assets/evidence/android-logcat.txt
            adb exec-out run-as com.polymath.app.offline tar -cf - files/offline-ui-evidence > offline-ui-evidence.tar
            tar -xf offline-ui-evidence.tar -C release-assets/evidence
            grep -q 'OK (1 test)' release-assets/evidence/offline-ui-tests.txt
      - name: Record end-to-end qualification
        run: |
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('release-assets/BUILD_INFO.json')
          info = json.loads(path.read_text())
          info['offline_ui_test'] = {'passed': True, 'api': 35, 'abi': 'x86_64', 'emulator_ram_mb': 6144, 'airplane_mode': True, 'model_from_apk_assets': True, 'normal_chat_ui': True, 'api_key_configured': False}
          path.write_text(json.dumps(info, indent=2) + '\n')
          print(path.read_text())
          PY
          python3 scripts/validate_project.py
      - name: Print lint report on failure
        if: failure()
        run: |
          if [ -f android/app/build/reports/lint-results-debug.txt ]; then cat android/app/build/reports/lint-results-debug.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-preview-verification
          compression-level: 0
          path: |
            release-assets/
            android/**/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/screenshots/
