name: Polymath verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build, test and lint
        run: bash gradlew :app:assembleDebug :core:model:test :core:data:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/**/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/screenshots/
  rag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/rag/requirements*.txt
      - run: pip install -r services/rag/requirements-dev.txt
      - name: API, scope, citation and media tests
        env:
          PYTHONPATH: services/rag
        run: python -m pytest services/rag/tests -q --junitxml=rag-tests.xml
      - name: Validate examples and deployment configuration
        run: |
          python scripts/validate_project.py
          POLYMATH_API_KEY=ci-test-only-placeholder-key-12345 docker compose config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-verification
          path: rag-tests.xml
